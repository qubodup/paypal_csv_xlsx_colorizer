<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Color Text Live Preview</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    .app {
        max-width: 1200px;
        margin: 0 auto;
    }

    .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
    }

    .panel {
        min-width: 0;
    }

    .panel-title {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
    }

    textarea {
        display: block;
        width: 100%;
        min-height: 500px;
        padding: 16px;
        resize: vertical;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: white;
        font: 14px/1.5 monospace;
        outline: none;
    }

    textarea:focus {
        border-color: #888;
    }

    .preview {
        min-height: 500px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
        overflow: auto;
    }

    .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 48px;
        padding: 4px 0 28px;
    }

    .row + .row {
        border-top: 1px solid #eee;
        margin-top: 8px;
        padding-top: 12px;
    }

    .swatch {
        width: 44px;
        height: 44px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        position: relative;
        cursor: default;
    }

    .swatch span {
        position: absolute;
        left: 50%;
        bottom: -22px;
        transform: translateX(-50%);
        white-space: nowrap;
        font: 11px monospace;
        color: #555;
    }

    .empty {
        color: #999;
        font-size: 14px;
    }

    @media (max-width: 700px) {
        .workspace {
            grid-template-columns: 1fr;
        }

        textarea,
        .preview {
            min-height: 300px;
        }
    }
</style>
</head>

<body>

<div class="app">
    <div class="workspace">
        <section class="panel">
            <h2 class="panel-title">Text</h2>

            <textarea id="input" spellcheck="false">"F2D98D","B8D39B","83B5D2","B8ADD0","D98F8F",
"8CB8BE","E3B17E","A394C2","91B6D4","A8C98F"

#ff0000
0x00ff00
112233
#33669980</textarea>
        </section>

        <section class="panel">
            <h2 class="panel-title">Preview</h2>
            <div class="preview" id="preview"></div>
        </section>
    </div>
</div>

<script>
const input = document.getElementById("input");
const preview = document.getElementById("preview");

const hexRegex = /(?<![A-Za-z0-9])(?:#|0x)?([0-9A-Fa-f]{3}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})(?![A-Za-z0-9])/g;

function normalizeColor(value) {
    if (value.length === 3 || value.length === 4) {
        return "#" + [...value].map(character => character + character).join("");
    }

    return "#" + value;
}

function updatePreview() {
    preview.innerHTML = "";

    if (input.value === "") {
        preview.innerHTML = '<div class="empty">Colors will appear here...</div>';
        return;
    }

    const lines = input.value.split(/\r?\n/);

    lines.forEach(line => {
        const row = document.createElement("div");
        row.className = "row";

        const matches = [...line.matchAll(hexRegex)];

        matches.forEach(match => {
            const raw = match[0];
            const hex = match[1];
            const color = normalizeColor(hex);

            const swatch = document.createElement("div");
            swatch.className = "swatch";
            swatch.style.backgroundColor = color;
            swatch.title = raw;

            const label = document.createElement("span");
            label.textContent = raw;

            swatch.appendChild(label);
            row.appendChild(swatch);
        });

        preview.appendChild(row);
    });
}

input.addEventListener("input", updatePreview);

updatePreview();
</script>

</body>
</html>
