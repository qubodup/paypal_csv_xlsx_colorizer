<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayPal CSV Colorizer</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:60px auto;padding:0 24px;background:#f7f7f5;color:#222}
  h1{font-size:25px;font-weight:600}
  .box{background:white;border:1px solid #ddd;border-radius:12px;padding:28px}
  input{margin:14px 0}
  button{background:#222;color:white;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  #status{margin-top:18px;color:#555;white-space:pre-line}
  small{color:#777}
</style>
</head>
<body>
<h1>PayPal CSV Colorizer</h1>
<div class="box">
  <div>Select PayPal CSV file:</div>
  <input id="file" type="file" accept=".csv,text/csv">
  <br>
  <button id="go" disabled>Color CSV and create XLSX</button>
  <div id="status"></div>
  <p><small>Rows are grouped by transaction ID and reference transaction ID. Rows without related transactions are colored individually.</small></p>
</div>

<script>
const COLORS = [
  "F2D98D","B8D39B","83B5D2","A394C2","D98F8F","E3B17E"
];

const fileInput = document.getElementById("file");
const go = document.getElementById("go");
const status = document.getElementById("status");
let selectedFile = null;

fileInput.addEventListener("change", () => {
  selectedFile = fileInput.files[0] || null;
  go.disabled = !selectedFile;
  status.textContent = selectedFile ? selectedFile.name : "";
});

function norm(s) {
  return String(s ?? "")
    .trim()
    .toLowerCase()
    .replaceAll("ä", "a")
    .replaceAll("ö", "o")
    .replaceAll("ü", "u")
    .replaceAll("ß", "ss")
    .replaceAll(" ", "");
}

function detectDelimiter(text) {
  const first = text.replace(/^\uFEFF/, "").split(/\r?\n/).find(x => x.trim());
  if (!first) return ",";
  const counts = [",",";","\t"].map(d => [d, (first.match(new RegExp(
    d === "\t" ? "\\t" : "\\" + d, "g")) || []).length]);
  return counts.sort((a,b) => b[1]-a[1])[0][0] || ",";
}

// RFC4180-ish CSV parser with quoted fields.
function parseCSV(text, delimiter) {
  text = text.replace(/^\uFEFF/, "");
  const out = [];
  let row = [], field = "", quoted = false;
  for (let i=0;i<text.length;i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += ch;
    } else {
      if (ch === '"') quoted = true;
      else if (ch === delimiter) { row.push(field); field=""; }
      else if (ch === "\n") { row.push(field); out.push(row); row=[]; field=""; }
      else if (ch !== "\r") field += ch;
    }
  }
  row.push(field);
  if (row.length > 1 || row[0] !== "") out.push(row);
  return out;
}

function makeGroups(rows, txCol, relCol) {
  const n = rows.length;
  const parent = Array.from({length:n}, (_,i)=>i);

  function find(x) {
    while (parent[x] !== x) {
      parent[x] = parent[parent[x]];
      x = parent[x];
    }
    return x;
  }
  function union(a,b) {
    a=find(a); b=find(b);
    if (a !== b) parent[b]=a;
  }

  const txMap = new Map();
  const relMap = new Map();

  rows.forEach((r,i) => {
    const tx = String(r[txCol] ?? "").trim();
    const rel = String(r[relCol] ?? "").trim();
    if (tx) {
      if (!txMap.has(tx)) txMap.set(tx,[]);
      txMap.get(tx).push(i);
    }
    if (rel) {
      if (!relMap.has(rel)) relMap.set(rel,[]);
      relMap.get(rel).push(i);
    }
  });

  // Identical transaction codes belong together.
  for (const indices of txMap.values())
    for (let j=1;j<indices.length;j++) union(indices[0],indices[j]);

  // A related transaction code connects to the row(s) carrying that transaction code.
  for (const [rel, indices] of relMap.entries()) {
    const targets = txMap.get(rel) || [];
    for (const i of indices)
      for (const j of targets) union(i,j);
  }

  // Identical related codes also belong together.
  for (const indices of relMap.values())
    for (let j=1;j<indices.length;j++) union(indices[0],indices[j]);

  const groups = new Map();
  for (let i=0;i<n;i++) {
    const root=find(i);
    if (!groups.has(root)) groups.set(root,[]);
    groups.get(root).push(i);
  }

  // Preserve first appearance in the CSV.
  return [...groups.values()].sort((a,b)=>a[0]-b[0]);
}

go.addEventListener("click", async () => {
  if (!selectedFile) return;

  try {
    status.textContent = "Processing...";
    const text = await selectedFile.text();
    const delimiter = detectDelimiter(text);
    const data = parseCSV(text, delimiter);

    if (data.length < 1) throw new Error("The CSV file is empty.");
    const headers = data[0];
    const rows = data.slice(1).filter(r => r.some(x => String(x).trim() !== ""));

    const normalized = headers.map(norm);

    // Support the German and English PayPal column names used by these exports.
    // Transaction types are only used for highlighting, never for grouping.
    const txAliases = new Set([
      "transaktionscode",
      "transactionid"
    ]);
    const relAliases = new Set([
      "zugehorigertransaktionscode",
      "referencetxnid"
    ]);
    const typeAliases = new Set([
      "typ",
      "type"
    ]);
    const currencyAliases = new Set([
      "wahrung",
      "waehrung",
      "currency"
    ]);
	const balanceImpactAliases = new Set([
	  "auswirkungaufguthaben",
	  "balanceimpact"
	]);

    const txCol = normalized.findIndex(h => txAliases.has(h));
    const relCol = normalized.findIndex(h => relAliases.has(h));
    const typeCol = normalized.findIndex(h => typeAliases.has(h));
    const currencyCol = normalized.findIndex(h => currencyAliases.has(h));
	const balanceImpactCol = normalized.findIndex(h => balanceImpactAliases.has(h));

    if (txCol < 0 || relCol < 0) {
      throw new Error(
        'Could not find the required transaction ID columns. Supported headers: ' +
        '"Transaktionscode" / "Zugehöriger Transaktionscode" (German) or ' +
        '"Transaction ID" / "Reference Txn ID" (English). ' +
        'Headers found: ' + headers.join(" | ")
      );
    }

    const groups = makeGroups(rows, txCol, relCol);
    const rowToGroup = new Map();
    groups.forEach((group, gi) => group.forEach(i => rowToGroup.set(i, gi)));

    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet("PayPal");

    // Header
    const headerRow = worksheet.addRow(headers);
    headerRow.eachCell(cell => {
      cell.fill = {
        type: "pattern",
        pattern: "solid",
        fgColor: { argb: "FFB7B7B7" }
      };
      cell.font = { bold: true };
    });

    // Every row gets a color, including singleton groups.
    // These German transaction types are highlighted in yellow.
    // Currency cells are also highlighted when the currency is not EUR.
    const highlightedTypes = new Set([
      "rückbuchung allgemeiner einbehaltung",
	  "general hold release",
      "rückzahlung",
	  "payment reversal",
      "allgemeine währungsumrechnung",
	  "general currency conversion",
      "bankgutschrift auf paypal-konto",
	  "bank deposit to pp account"
    ]);
    const brightYellow = "FFFFFF00";

    rows.forEach((row, i) => {
      const excelRow = worksheet.addRow(row);
      const color = COLORS[rowToGroup.get(i) % COLORS.length];
      excelRow.eachCell({ includeEmpty: true }, (cell, columnNumber) => {
        const isHighlightedType =
          typeCol >= 0 &&
          columnNumber === typeCol + 1 &&
          highlightedTypes.has(String(row[typeCol] ?? "").trim().toLowerCase());
        const isNonEurCurrency =
          currencyCol >= 0 &&
          columnNumber === currencyCol + 1 &&
          String(row[currencyCol] ?? "").trim().toUpperCase() !== "EUR";
		const isMemo =
		  balanceImpactCol >= 0 &&
		  columnNumber === balanceImpactCol + 1 &&
		  String(row[balanceImpactCol] ?? "").trim().toLowerCase() === "memo";

        cell.fill = {
          type: "pattern",
          pattern: "solid",
          fgColor: { argb: (isHighlightedType || isNonEurCurrency || isMemo) ? brightYellow : "FF" + color }
        };
      });
    });

    worksheet.views = [{ state: "frozen", ySplit: 1 }];
    worksheet.autoFilter = {
      from: { row: 1, column: 1 },
      to: { row: rows.length + 1, column: headers.length }
    };

    // Reasonable column widths.
    headers.forEach((header, c) => {
      let max = String(header).length;
      for (const r of rows.slice(0, 1000)) {
        max = Math.max(max, String(r[c] ?? "").length);
      }
      worksheet.getColumn(c + 1).width = Math.min(Math.max(max + 2, 10), 45);
    });

    const base = selectedFile.name.replace(/\.[^.]+$/, "");
    const outputName = base + "_color.xlsx";

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob(
      [buffer],
      { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = outputName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    status.textContent =
      `Done: ${outputName}\n${rows.length} data rows in ${groups.length} transaction groups.`;
  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
